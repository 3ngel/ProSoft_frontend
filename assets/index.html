<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Проект РИЗ-330916у</title>
</head>
<body>
    <div id="app">
        <div class="header">
            <h1>Зона авторизаци</h1>
        </div>
        <div class="info">
            <div class="form">
                <p>Логин</p>
                <input type="text"
                    v-model="login"
                    v-on:input="handlelogin">
                <p>Пароль</p>
                <input type="password"
                    v-model="password"
                    v-on:input="handlepassword">
                <button class="btn" v-on:click="authorization">Авторизация</button>
            </div>
        </div>
        <div class="folder">
            <p>{{folder}}</p>
        </div>
    </div>
    <script src="md5.min.js"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="./main.js"></script>
</body>
</html>
